    max-width: 680px; margin: 0 auto; background: #fff;

    background: #f2f7fd; border: 1px solid #d6e6f7; border-radius: 10px;
  }
  .email span { color: var(--muted); font-size: 13px; letter-spacing: .08em;
                text-transform: uppercase; display: block; margin-bottom: 2px; }
  a { color: var(--accent); text-decoration: none; word-break: break-all; }
  a:hover { text-decoration: underline; }
  hr { border: 0; border-top: 1px solid var(--line); margin: 34px 0; }
  h2 { font-size: 13px; letter-spacing: .12em; text-transform: uppercase;
       color: var(--muted); font-weight: 600; margin: 0 0 12px; }
  ul { margin: 0; padding-left: 20px; }
  li { margin: 5px 0; }
  footer { margin-top: 40px; font-size: 13px; color: #9aa3ad; }
  @media (max-width: 560px) {
    body { padding: 20px 12px 48px; }
    main { padding: 32px 22px; border-radius: 10px; }
